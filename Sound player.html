<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio-Loop</title>
  <style>
    :root {
      --bg: #f2f2f0;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #1f6feb;
      --stop: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --fg: #eaeaea;
        --muted: #9a9a9a;
        --accent: #4c8dff;
        --stop: #e5604f;
      }
    }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 600; }
    label.pick {
      padding: 10px 18px;
      border: 1.5px solid var(--muted);
      border-radius: 8px;
      cursor: pointer;
    }
    label.pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
    #playBtn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 2.2rem;
      cursor: pointer;
    }
    #playBtn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    #playBtn:disabled { opacity: 0.35; cursor: not-allowed; }
    #playBtn.playing { background: var(--stop); }
    #status { color: var(--muted); font-size: 0.95rem; text-align: center; max-width: 90%; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Audio-Loop</h1>

  <label class="pick">
    Audiodatei auswählen
    <input type="file" id="fileInput" accept="audio/*">
  </label>

  <button id="playBtn" disabled aria-label="Abspielen">▶</button>

  <div id="status">Bitte eine Audiodatei auswählen.</div>

  <audio id="player" loop></audio>

  <script>
    const fileInput = document.getElementById('fileInput');
    const playBtn = document.getElementById('playBtn');
    const player = document.getElementById('player');
    const status = document.getElementById('status');

    let currentUrl = null;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(file);

      player.src = currentUrl;
      player.loop = true;
      playBtn.disabled = false;
      playBtn.textContent = '▶';
      playBtn.classList.remove('playing');
      status.textContent = 'Geladen: ' + file.name;
    });

    playBtn.addEventListener('click', () => {
      if (player.paused) {
        player.play();
      } else {
        player.pause();
      }
    });

    player.addEventListener('play', () => {
      playBtn.textContent = '⏸';
      playBtn.classList.add('playing');
      playBtn.setAttribute('aria-label', 'Pausieren');
      status.textContent = 'Läuft in Endlosschleife …';
    });

    player.addEventListener('pause', () => {
      playBtn.textContent = '▶';
      playBtn.classList.remove('playing');
      playBtn.setAttribute('aria-label', 'Abspielen');
      status.textContent = 'Pausiert.';
    });
  </script>
</body>
</html>
